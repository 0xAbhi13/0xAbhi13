name: Update GitHub Profile Trophy

on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 * * *"

permissions:
  contents: write

jobs:
  trophy:
    runs-on: ubuntu-latest

    steps:
      - name: Generate GitHub Trophy
        uses: ryo-ma/github-profile-trophy-action@v0.2.2
        with:
          github_user_name: 0xAbhi13
          github_token: ${{ secrets.GITHUB_TOKEN }}
          output_path: ./profile/trophy.svg
          theme: darkhub
          columns: 6
          rows: 3

      - name: Commit trophy
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add profile/trophy.svg

          if git diff --cached --quiet; then
            echo "No changes"
          else
            git commit -m "Update GitHub trophies"
            git push
          fi
